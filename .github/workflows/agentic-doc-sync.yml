name: Agentic Doc Sync

on:
  schedule:
    - cron: '40 4 * * *' # Daily at 4:40am UTC — ahead of the 6:17am image sync
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch: # manual trigger, e.g. to test a change to the prompt

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run doc-sync agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
        run: |
          claude -p "$(cat .github/scripts/doc-sync-prompt.md)" \
            --mcp-config .mcp.json \
            --allowedTools "Edit,Write,Bash,mcp__figma__get_figma_data,mcp__figma__download_figma_images" \
            --permission-mode acceptEdits

      - name: Check for changes
        id: diff
        run: |
          git add website/docs website/static/img scripts/figma-images.json DOC_SYNC_SUGGESTIONS.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo "summary<<EOF"
              git diff --staged --stat
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(docs): agentic sync from Figma'
          title: 'chore: agentic doc sync from Figma'
          body: |
            Automated check of every documented component against its Figma spec.

            Directly edited: verifiable/structural drift only (anatomy order,
            properties tables, stale screenshots, missing Do/Don't or Caution
            sections). Any guideline-prose changes are **not** applied here —
            see `DOC_SYNC_SUGGESTIONS.md` in this diff (if present) for drafted
            text changes that need editorial review before landing elsewhere.

            Changed files:
            ```
            ${{ steps.diff.outputs.summary }}
            ```
          branch: chore/agentic-doc-sync
          delete-branch: true

      - name: Notify Slack
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          curl -sf -X POST -H 'Content-type: application/json' \
            --data "$(cat <<EOF
          {"text": "🦩 Flamingo docs auto-sync opened a PR: ${{ steps.cpr.outputs.pull-request-url }}"}
          EOF
          )" \
            "$SLACK_WEBHOOK_URL"

name: Sync Design Tokens from Figma

on:
  schedule:
    - cron: '0 9 * * 1' # Every Monday at 9am
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch tokens from Figma
        id: fetch-tokens
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: SS96QDVedbpCNWbkju1UbI
        run: |
          node scripts/sync-tokens-from-figma.js

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(tokens): sync design tokens from Figma'
          title: 'chore: sync design tokens from Figma'
          body: |
            ## Design Tokens Sync

            Automated sync of design tokens from Figma Core Library.

            **Changes:**
            - Color tokens (from theme)
            - Spacing tokens
            - Typography tokens

            Please review and merge if tokens are correct.
          branch: chore/sync-tokens-${{ github.run_number }}
          delete-branch: true

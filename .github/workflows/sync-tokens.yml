name: Transform Design Tokens

on:
  push:
    branches: [main]
    paths:
      - 'tokens-source/**'
  pull_request:
    paths:
      - 'tokens-source/**'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pull-requests: write

jobs:
  transform-tokens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Transform Figma token export into JSON
        run: node scripts/transform-figma-tokens.js

      - name: Commit generated tokens
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/tokens/
          git diff --staged --quiet && echo "No token changes" || git commit -m "chore(tokens): regenerate from tokens-source/"
          git push
